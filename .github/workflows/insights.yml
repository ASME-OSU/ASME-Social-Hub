name: Insights
on:
  schedule:
    # Stagger the catch-up opportunity from dispatch's 7/37 schedule.
    - cron: '19 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  task:
    uses: ./.github/workflows/run.yml
    with:
      task: insights
    secrets: inherit
