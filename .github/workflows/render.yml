name: Render and publish dashboard
on:
  push:
    branches: [main]
    paths: ['config/**', 'data/campaigns/**', 'docs/**', 'templates/**', 'scripts/**', 'package*.json', '.github/workflows/**']
  workflow_dispatch:
# Keep one running render and only the newest pending request. The reusable
# workflow still takes the separate campaign-repository lock before checkout.
concurrency:
  group: dashboard-render-requests
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  render:
    uses: ./.github/workflows/run.yml
    with:
      task: render
    secrets: inherit
