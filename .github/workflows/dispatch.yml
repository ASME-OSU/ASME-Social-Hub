name: Dispatch campaigns
on:
  schedule:
    - cron: '7,37 * * * *'
  repository_dispatch:
    types: [campaign-dispatch]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview actions without publishing
        type: boolean
        default: true
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  dispatch:
    uses: ./.github/workflows/run.yml
    with:
      task: dispatch
      # External triggers preview unless the authenticated caller opts into live.
      dry_run: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.event_name == 'repository_dispatch' && github.event.client_payload.mode != 'live') }}
    secrets: inherit
