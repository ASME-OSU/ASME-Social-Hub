name: Import campaign issue
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
jobs:
  import:
    if: startsWith(github.event.issue.title, '[Campaign]')
    runs-on: ubuntu-latest
    concurrency:
      group: campaign-repository
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import validated campaign from authorized officer
        id: import
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/import-issue.mjs
      - name: Explain invalid authorized request
        if: failure() && steps.import.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'Campaign import failed validation. Check that the Campaign JSON field contains fenced JSON with a unique ID, a future event in the active year, valid dates with timezone offsets, and supported campaign fields. Correct the request and reopen this issue to retry.'
      - name: Commit imported campaign
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/campaigns
          if ! git diff --cached --quiet; then
            git commit -m 'Import officer campaign request'
            git push origin HEAD:main
          fi
      - name: Confirm durable import and close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body 'Campaign imported and committed to the repository. Rendering and publishing will run next; scheduling follows the enabled campaign channels.'
          gh issue close "$ISSUE_NUMBER"
  publish:
    needs: import
    uses: ./.github/workflows/run.yml
    with:
      task: render
    secrets: inherit
