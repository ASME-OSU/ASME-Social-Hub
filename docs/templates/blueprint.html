<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{title}}</title>
<style>
{{fontCss}}
:root{--navy:{{primary}};--scarlet:{{accent}};--ice:{{background}};
--navy-deep:color-mix(in srgb,{{primary}} 72%,#000);--navy-mid:color-mix(in srgb,{{primary}} 82%,#fff);
--steel:color-mix(in srgb,{{primary}} 38%,#fff);--line:color-mix(in srgb,var(--ice) 10%,transparent);--soft:color-mix(in srgb,var(--ice) 78%,transparent)}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;overflow:hidden;background:var(--navy)}
body{font-family:Inter,Arial,sans-serif;color:var(--ice);-webkit-font-smoothing:antialiased}
.feed{height:1350px}.story{height:1920px}
.page{position:relative;width:1080px;height:100%;display:flex;flex-direction:column;justify-content:space-between;
 padding:84px 84px 84px;
 background:radial-gradient(900px 700px at 100% 0%,var(--navy-mid),transparent 70%),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/54px 54px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/54px 54px,var(--navy)}
.story .page{padding:270px 84px 360px}
/* decorative drawing mark: top-right, never behind text */
.mark{position:absolute;right:-190px;top:-210px;width:420px;height:420px;opacity:.4;pointer-events:none}
.story .mark{top:20px;right:-210px}
header{display:flex;justify-content:space-between;align-items:center;position:relative}
.brand{display:flex;align-items:center;max-width:70%;font-weight:700;font-size:26px;letter-spacing:.2em;text-transform:uppercase}
.tag{font-weight:600;font-size:22px;letter-spacing:.16em;text-transform:uppercase;padding:12px 22px;border:2px solid var(--scarlet);background:var(--scarlet);color:#fff}
.hero{position:relative}
.date{display:flex;align-items:flex-end;gap:26px;margin-bottom:34px}
.day{font-family:'DM Serif Display',Georgia,serif;font-size:260px;line-height:.78;letter-spacing:-.02em}
.story .day{font-size:330px}
.mon{font-weight:700;font-size:34px;letter-spacing:.22em;text-transform:uppercase;background:var(--scarlet);padding:12px 20px;margin-bottom:8px}
.rule{height:6px;width:120px;background:var(--scarlet);margin:0 0 34px}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:{{titleSize}}px;line-height:1.02;letter-spacing:-.01em;max-width:900px;overflow-wrap:anywhere}
.story h1{font-size:{{storyTitleSize}}px}
.desc{margin-top:30px;font-size:32px;line-height:1.4;color:var(--soft);max-width:800px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.story .desc{font-size:36px;-webkit-line-clamp:4}
/* title block, like the corner of an engineering drawing */
.block{position:relative;display:grid;grid-template-columns:1.25fr 1.25fr 1fr;border:2px solid var(--steel);background:color-mix(in srgb,var(--navy-deep) 85%,transparent)}
.block.nofood{grid-template-columns:1fr 1fr}
.cell{padding:22px 26px 24px;border-right:2px solid var(--steel)}
.cell:last-child{border-right:0}
.cell small{display:block;font-size:17px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--steel);margin-bottom:10px}
.cell b{overflow-wrap:anywhere;display:block;font-size:31px;line-height:1.2;font-weight:600}
.cell span{display:block;font-size:26px;color:var(--soft);margin-top:4px}
.cell.food{background:var(--scarlet);color:#fff;border-right:0}
.cell.food small{color:rgba(255,255,255,.8)}
footer{display:flex;justify-content:space-between;align-items:center;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);position:relative}
.flyer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.logo{height:128px;max-width:100%;object-fit:contain;object-position:left}.photo-overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--navy) 70%,transparent)}
header,.hero,.block,footer{flex-shrink:0}footer{gap:24px}footer span:last-child{text-align:right}header{gap:24px}.tag{max-width:34%;font-size:20px;overflow-wrap:anywhere}.desc:empty{display:none}
.advertising{margin-top:22px;font-size:23px;line-height:1.35;overflow-wrap:anywhere}.advertising p{margin:0 0 8px}.advertising small{font-size:17px;color:var(--soft)}.enriched .day{font-size:170px}.story.enriched .day{font-size:230px}.enriched .date{margin-bottom:22px}.enriched .rule{margin-bottom:22px}.enriched .desc{font-size:25px;-webkit-line-clamp:2;margin-top:20px}.enriched .advertising{max-width:850px}
</style></head>
<body class="{{format}} {{advertisingClass}}"><main class="page">{{flyer}}
<svg class="mark" viewBox="0 0 400 400" fill="none" stroke="{{background}}" stroke-width="2"><circle cx="200" cy="200" r="150"/><circle cx="200" cy="200" r="96" stroke-dasharray="10 8"/><circle cx="200" cy="200" r="14"/><path d="M200 20v360M20 200h360" stroke-dasharray="26 8 4 8"/></svg>
<header><div class="brand">{{brand}}</div><div class="tag">{{type}}</div></header>
<section class="hero">
 <div class="date"><div class="day">{{day}}</div><div class="mon">{{month}}</div></div>
 <div class="rule"></div>
 <h1>{{title}}</h1>
 <p class="desc">{{description}}</p>
 {{advertising}}
</section>
<section class="block {{foodClass}}">
 <div class="cell"><small>When</small><b>{{date}}</b><span>{{time}}</span></div>
 <div class="cell"><small>Where</small><b>{{location}}</b></div>
 {{foodCell}}
</section>
<footer><span>{{handle}}</span><span>{{school}}</span></footer>
</main></body></html>
