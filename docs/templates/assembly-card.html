<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{{title}}</title><style>

{{fontCss}}
:root{--navy:{{primary}};--scarlet:{{accent}};--ice:{{background}};--muted:#c2d1df;--cream:#f6f2e9}
*{box-sizing:border-box;margin:0}html,body{width:1080px;overflow:hidden}body{font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}.feed{height:1350px}.story{height:1920px}
.page{position:relative;width:1080px;height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:70px 76px;color:var(--ice);background:var(--navy);overflow:hidden}
.story .page{padding:250px 76px 310px;gap:32px}header,.hero,.block,footer{position:relative;flex-shrink:0;z-index:1}header{display:flex;justify-content:space-between;align-items:center;gap:32px}
.brand{display:flex;align-items:center;max-width:65%;font-size:28px;line-height:1.2;font-weight:650;color:inherit;background:transparent;padding:0}.logo{height:164px;width:auto;max-width:420px;object-fit:contain;object-position:left center}.story .logo{height:180px}
.tag{font-size:21px;line-height:1.35;letter-spacing:.09em;text-transform:uppercase;font-weight:650;text-align:right;max-width:32%;overflow-wrap:anywhere}
h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:{{titleSize}}px;line-height:1.02;letter-spacing:-.025em;overflow-wrap:anywhere;max-width:900px}.story h1{font-size:calc({{storyTitleSize}}px * 1.22)}
.desc{font-size:32px;line-height:1.35;margin-top:22px;color:var(--muted);max-width:860px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.story .desc{font-size:36px}.desc:empty{display:none}
.advertising{margin-top:20px;font-size:23px;line-height:1.35;overflow-wrap:anywhere}.advertising p{margin-bottom:7px}.advertising p:last-of-type{margin-bottom:0}.advertising small{display:block;font-size:19px;color:var(--muted);margin-top:8px}
.enriched .desc{font-size:27px;-webkit-line-clamp:2}.enriched .advertising{font-size:22px}.story.enriched .desc{font-size:30px}
.block{display:grid;grid-template-columns:1.25fr 1.5fr .75fr;border:1px solid #adc2d666;background:#0c2035}.block.nofood{grid-template-columns:1fr 1.3fr}.cell{padding:24px 26px;min-width:0;border-right:1px solid #adc2d666}.cell:last-child{border:0}.cell small{display:block;font-size:19px;line-height:1.3;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:11px}.cell b{display:block;font-size:31px;line-height:1.25;font-weight:600;overflow-wrap:anywhere}.cell span{display:block;font-size:27px;line-height:1.3;margin-top:9px;overflow-wrap:anywhere}.cell.food{background:var(--scarlet);color:#fff}.cell.food small{color:#fff}.cell.food b{font-size:28px}
footer{display:flex;justify-content:space-between;align-items:center;gap:28px;font-size:21px;line-height:1.4;color:var(--muted)}footer span{max-width:50%;overflow-wrap:anywhere}footer span:last-child{text-align:right}
.flyer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photo-overlay{position:absolute;inset:0;background:color-mix(in srgb,var(--navy) 89%,transparent)}

.page{background:#e7eef3;color:var(--navy);--muted:#425b70;gap:22px}.story .page{gap:28px}.page:before{z-index:1;content:'';position:absolute;inset:0 0 auto;height:265px;background:var(--navy)}.story .page:before{height:470px}.tag{color:#fff}.brand{background:transparent}.assembly-art{display:block;width:100%;height:240px;margin:0 auto 22px}.story .assembly-art{height:330px}.enriched .assembly-art{height:170px}.story.enriched .assembly-art{height:220px}.title-card{background:#fff;border-top:7px solid var(--scarlet);padding:26px 34px 30px}h1{font-family:Inter,Arial,sans-serif;font-size:calc({{titleSize}}px * .86);font-weight:700;letter-spacing:-.04em}.story h1{font-size:calc({{storyTitleSize}}px * .92)}.desc{font-size:29px;margin-top:15px}.story .desc{font-size:32px}.enriched .desc{font-size:25px}.advertising{font-size:21px;margin-top:16px}.enriched .advertising{font-size:21px;line-height:1.3}.block{background:#fff;border:0;box-shadow:0 10px 0 #c4d2dd}.cell{border-color:#bdcbd7}.cell small{color:#526476}.cell.food small{color:#fff}.photo-overlay{background:color-mix(in srgb,#e7eef3 94%,transparent)}

</style></head><body class="{{format}} {{advertisingClass}}"><main class="page">{{flyer}}<header><div class="brand">{{brand}}</div><div class="tag">{{type}}</div></header><section class="hero"><svg class="assembly-art artwork" viewBox="0 0 760 430" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Interlocking engineering forms"><defs><pattern id="assembly-grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#8ea3b5" stroke-width="1" opacity=".20"/></pattern></defs><rect width="760" height="430" fill="url(#assembly-grid)"/><ellipse cx="380" cy="355" rx="290" ry="42" fill="#102840" opacity=".08"/><g transform="translate(108 40)"><path d="M0 170L220 44L460 182L240 309Z" fill="#b8cbd9"/><path d="M0 170V202L240 341V309Z" fill="#7e98ad"/><path d="M240 309V341L460 214V182Z" fill="#98b1c3"/><path d="M68 132L151 84L375 213L292 261Z" fill="{{accent}}"/><path d="M68 132V178L292 307V261Z" fill="#8c0923"/><path d="M292 261V307L375 259V213Z" fill="#d23a58"/><path d="M170 21L244 -22L469 108L395 151Z" fill="#274a69"/><path d="M170 21V75L395 205V151Z" fill="{{primary}}"/><path d="M395 151V205L469 162V108Z" fill="#1b3c59"/><path d="M278 125L392 59L539 144L425 210Z" fill="#f8f5eb"/><path d="M278 125V162L425 247V210Z" fill="#d6d6cf"/><path d="M425 210V247L539 181V144Z" fill="#ece9de"/><ellipse cx="409" cy="137" rx="36" ry="21" fill="#102840"/><path d="M374 137c2-24 65-24 70 0" fill="none" stroke="#8098ad" stroke-width="7"/><g stroke="#102840" stroke-width="2" fill="none" opacity=".45"><path d="M-38 180L-38 242L203 381M-50 235l24 14M192 369l24 14"/><path d="M524 79L584 114L584 211M572 204l24 14"/></g></g></svg><div class="title-card"><h1>{{title}}</h1><p class="desc">{{description}}</p>{{advertising}}</div></section><section class="block {{foodClass}}"><div class="cell"><small>When</small><b>{{shortDate}}</b><span>{{time}}</span></div><div class="cell"><small>Where</small><b>{{location}}</b></div>{{foodCell}}</section><footer><span>{{handle}}</span><span>{{school}}</span></footer></main></body></html>
