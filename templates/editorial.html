<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1080px;height:100vh;background:{{background}};color:{{primary}};font-family:Arial,sans-serif;overflow:hidden}.sheet{height:100vh;padding:76px;display:flex;flex-direction:column;position:relative}.masthead{font-weight:800;font-size:25px;letter-spacing:3px;text-transform:uppercase;border-bottom:2px solid {{primary}};padding-bottom:32px;display:flex;align-items:center;gap:24px}.logo{width:80px;height:80px;object-fit:contain}.tag{margin-top:65px;font-size:24px;text-transform:uppercase;font-weight:700;letter-spacing:4px;color:{{accent}}}.title{font-family:Georgia,serif;font-size:{{titleSize}}px;line-height:1.02;letter-spacing:-4px;margin:32px 0;overflow-wrap:anywhere}.description{font-size:31px;line-height:1.4;max-height:220px;overflow:hidden;white-space:pre-line}.details{margin-top:auto;border-top:3px solid {{primary}};padding-top:32px;font-size:35px;line-height:1.5}.date{font-weight:800}.food{display:inline-block;background:{{accent}};color:white;border-radius:50px;padding:12px 24px;font-size:24px;margin-top:20px}.footer{margin-top:30px;font-size:22px;letter-spacing:2px;font-weight:700}.flyer{max-height:36vh;max-width:100%;object-fit:contain;margin:24px auto}.story .title{font-size:{{storyTitleSize}}px}.story .tag{margin-top:100px}.story .details{margin-bottom:100px}.shape{position:absolute;right:-150px;top:210px;width:400px;height:400px;border:60px solid {{accent}};border-radius:50%;opacity:.08;z-index:-1}
.sheet{justify-content:space-between;overflow:hidden}.hero,.block,header,footer{flex-shrink:0}.details{margin-top:0}.advertising{font-size:24px;line-height:1.35;margin:20px 0;overflow-wrap:anywhere}.advertising p{margin:0 0 8px}.advertising small{font-size:18px}.enriched .tag{margin-top:24px}.enriched .description{font-size:25px;max-height:105px}.enriched .title{margin:24px 0}.story.enriched .tag{margin-top:40px}.story .details{margin-bottom:30px}
</style></head><body class="{{format}} {{advertisingClass}}"><div class="sheet page"><div class="shape"></div><header class="masthead">{{logo}}{{chapter}}</header><section class="hero"><div class="tag">{{type}}</div><h1 class="title">{{title}}</h1>{{flyer}}<div class="description">{{description}}</div>{{advertising}}</section><div class="details block"><div class="date">{{date}}</div><div>{{time}}</div><div>{{location}}</div>{{food}}</div><footer class="footer">{{school}} {{handle}}</footer></div></body></html>
